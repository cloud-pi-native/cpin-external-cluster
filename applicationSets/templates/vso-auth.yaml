{{ if not .Values.openshift.enabled -}}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: default
  namespace: argo-cpin
  annotations:
    argocd.argoproj.io/sync-wave: "10" # Après l'installation des CRDs VSO (via cpin-appsets)
spec:
  address: {{ .Values.vault.url }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: vso-approle
  namespace: argo-cpin
  annotations:
    argocd.argoproj.io/sync-wave: "10" # Après l'installation des CRDs VSO (via cpin-appsets)
stringData:
  id: {{ .Values.vault.secretId }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth
  namespace: argo-cpin
  annotations:
    argocd.argoproj.io/sync-wave: "10" # Après l'installation des CRDs VSO (via cpin-appsets)
spec:
{{- if not .Values.openshift.enabled }}
  vaultConnectionRef: default
{{- end }}
  method: appRole
  mount: approle
  appRole:
    roleId: {{ .Values.vault.roleId }}
    secretRef: vso-approle
  allowedNamespaces: 
    - argo-cpin
